services:
  - type: web
    name: anistream-hub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: PORT
        value: 8080
      - key: ENABLE_ADULT_CONTENT
        value: "true"
      - key: BASE_URL
        value: "https://anifoxwatch-dko2.onrender.com"
    healthCheckPath: /health
    autoDeploy: false